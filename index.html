<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a110b" />
    <title>Overlord — Forest Vertical Slice</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="start-screen">
      <div class="panel">
        <div class="eyebrow">OVERLORD // VERTICAL SLICE 0.1</div>
        <h1>Enter the Forest</h1>
        <p>First-person movement prototype. Click to capture the mouse.</p>
        <button id="start-button">ENTER WORLD</button>
        <div class="controls">
          <span><b>WASD</b> Move</span>
          <span><b>SHIFT</b> Sprint</span>
          <span><b>SPACE</b> Jump</span>
          <span><b>ESC</b> Release mouse</span>
        </div>
      </div>
    </div>

    <div id="hud">
      <div id="crosshair"></div>
      <div id="status">FOREST // PLAYABLE BUILD</div>
      <div id="fps">-- FPS</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
