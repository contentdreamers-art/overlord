<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100a" />
    <title>Overlord — Forest Slice</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="start-screen">
      <div class="panel">
        <div class="eyebrow">OVERLORD // COMPACT FOREST BUILD</div>
        <h1>Enter the Forest</h1>
        <p>A small, dense first-person forest built to spend the graphics budget on detail instead of map size.</p>
        <button id="start-button">ENTER WORLD</button>
        <div class="controls">
          <span><b>WASD</b> Move</span>
          <span><b>SHIFT</b> Sprint / Swim faster</span>
          <span><b>SPACE</b> Jump / Rise</span>
          <span><b>CTRL or C</b> Dive</span>
          <span><b>ESC</b> Release mouse</span>
        </div>
      </div>
    </div>

    <div id="hud">
      <div id="crosshair"></div>
      <div id="status">FOREST // HIGH DETAIL SLICE</div>
      <div id="fps">-- FPS</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
